<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Artha Megayasa — Neurologist, founder, and product builder</title>
  <desc id="description">A navy and teal profile banner connecting medicine, AI, and software. From clinical insight to useful software.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081923"/>
      <stop offset="1" stop-color="#0C2632"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(1050 180) rotate(90) scale(234 315)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#26CBB9" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#26CBB9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="857" y1="112" x2="1193" y2="254" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6CE7D2"/>
      <stop offset="1" stop-color="#57B5D7"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="20" fill="url(#background)"/>
  <rect width="1280" height="360" rx="20" fill="url(#halo)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="19.5" stroke="#78BFC8" stroke-opacity="0.12"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="64" y="58" width="4" height="17" rx="2" fill="#72E1CC"/>
    <text x="83" y="71" fill="#8ED7D0" font-size="14" font-weight="600" letter-spacing="2.9">MEDICINE / AI / SOFTWARE</text>
    <text x="60" y="166" fill="#F4FAFB" font-size="68" font-weight="650" letter-spacing="-2.7">Artha Megayasa</text>
    <text x="64" y="213" fill="#BDCCD4" font-size="25" font-weight="400" letter-spacing="0.05">Neurologist. Founder. Product builder.</text>
    <path d="M64 266H116" stroke="#64D2C2" stroke-width="2"/>
    <text x="64" y="306" fill="#8FAAB6" font-size="18" font-weight="400" letter-spacing="0.15">From clinical insight to useful software.</text>
  </g>

  <!-- A quiet network: clinical understanding becomes connected systems. -->
